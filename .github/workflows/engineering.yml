name: Engineering milestone
on:
  workflow_dispatch:
  push:
    branches: ['feature/zero-ime-foundation', 'main']
    paths: ['.github/engineering-milestone.txt']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python3 -m unittest discover -s research/asr -p 'test_*.py' -v
      - run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-reports
          path: |
            app/build/reports/
            app/build/test-results/
