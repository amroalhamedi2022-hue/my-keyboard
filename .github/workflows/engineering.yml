name: Engineering milestone
on:
  workflow_dispatch:
  push:
    branches: ['feature/zero-ime-foundation', 'main']
    paths: ['.github/engineering-milestone.txt']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python3 -m unittest discover -s research/asr -p 'test_*.py' -v
      - name: Pure JVM research smoke tests
        run: |
          javac -encoding UTF-8 -d /tmp/zero-smoke app/src/main/java/com/zerokeyboard/ime/KeyboardLayout.java app/src/main/java/com/zerokeyboard/ime/glide/GeometricRanker.java app/src/main/java/com/zerokeyboard/ime/voice/ModelCatalog.java app/src/main/java/com/zerokeyboard/ime/LayoutProfile.java research/glide/Smoke.java research/voice/CatalogSmoke.java research/layout/LayoutSmoke.java
          java -ea -cp /tmp/zero-smoke Smoke
          java -ea -cp /tmp/zero-smoke CatalogSmoke
          java -ea -cp /tmp/zero-smoke LayoutSmoke
      - name: Continuous audio segmentation and queue smoke
        run: |
          javac -encoding UTF-8 -d /tmp/zero-continuous app/src/main/java/com/zerokeyboard/ime/voice/SpeechWindow.java app/src/main/java/com/zerokeyboard/ime/voice/AudioSegments.java app/src/main/java/com/zerokeyboard/ime/voice/SegmentedDecoder.java research/voice/ContinuousSmoke.java
          java -cp /tmp/zero-continuous ContinuousSmoke
      - name: Frequency resource and voice options smoke
        run: |
          javac -encoding UTF-8 -d /tmp/zero-batch7 app/src/main/java/com/zerokeyboard/ime/glide/FrequencyLexicon.java app/src/main/java/com/zerokeyboard/ime/voice/VoiceOptions.java research/tools/Batch7Smoke.java
          java -cp /tmp/zero-batch7 Batch7Smoke
      - name: Personal lexicon, clipboard and ranker smoke
        run: |
          javac -encoding UTF-8 -d /tmp/zero-batch6 app/src/main/java/com/zerokeyboard/ime/glide/PersonalLexicon.java app/src/main/java/com/zerokeyboard/ime/glide/GeometricRanker.java app/src/main/java/com/zerokeyboard/ime/tools/ClipboardHistory.java research/tools/Batch6Smoke.java research/glide/RankerEquivalence.java
          java -ea -cp /tmp/zero-batch6 Batch6Smoke
          java -ea -cp /tmp/zero-batch6 RankerEquivalence
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-reports
          path: |
            app/build/reports/
            app/build/test-results/
